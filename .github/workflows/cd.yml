name: CD

# Push/merge to main (or master) publishes a rolling "latest" prerelease.
# Pushing a tag like v1.2.3 publishes a normal versioned release.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${{ github.ref_name }}"; v="${v#v}"          # v1.2.3 -> 1.2.3
            asset="DevProfile-$v"                            # versioned name; one release per tag
          else
            v="0.1.0-ci.${{ github.run_number }}"           # rolling main build
            asset="DevProfile"                              # stable name -> overwritten on 'latest'
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      # Gate the release on a green test run so we never ship a broken package.
      - name: Test
        run: dotnet test DevProfile.slnx --configuration Release

      - name: Publish app (self-contained, single file — no .NET install needed)
        run: >
          dotnet publish src/DevProfile.App/DevProfile.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          --output publish/${{ matrix.rid }}

      - name: Publish CLI (self-contained, single file)
        run: >
          dotnet publish src/DevProfile.Cli/DevProfile.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          --output publish-cli/${{ matrix.rid }}

      - name: Package zips
        shell: pwsh
        run: |
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath ${{ steps.ver.outputs.asset }}-${{ matrix.rid }}.zip
          Compress-Archive -Path publish-cli/${{ matrix.rid }}/* -DestinationPath ${{ steps.ver.outputs.asset }}-cli-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DevProfile-${{ matrix.rid }}
          path: '*.zip'
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and move the rolling "latest" tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}"              >> "$GITHUB_OUTPUT"
            echo "name=${{ github.ref_name }}"             >> "$GITHUB_OUTPUT"
            echo "prerelease=false"                        >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest"                              >> "$GITHUB_OUTPUT"
            echo "name=Latest build (main @ ${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"
            echo "prerelease=true"                         >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: dist/*.zip
          fail_on_unmatched_files: true
          body: |
            Self-contained Windows builds — no .NET install required.
            - GUI: download the zip for your architecture, extract, run `DevProfile.App.exe`.
            - CLI: download the `-cli-` zip, extract, run `devprofile.exe` (`devprofile help`).

            Built from commit ${{ github.sha }}.
