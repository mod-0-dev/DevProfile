name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build DevProfile.slnx --configuration Release

      - name: Test
        run: dotnet test DevProfile.slnx --configuration Release --no-build --verbosity normal
